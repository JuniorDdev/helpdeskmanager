{% if pagination and pagination.pages > 1 %}
<nav class="mt-3" aria-label="Paginação">
  <ul class="pagination justify-content-center">
    <li class="page-item {{ 'disabled' if not pagination.has_prev }}">
      <a class="page-link" href="{{ url_for(request.endpoint, page=pagination.prev_num) if pagination.has_prev else '#' }}">Anterior</a>
    </li>
    <li class="page-item disabled"><span class="page-link">Página {{ pagination.page }} de {{ pagination.pages }}</span></li>
    <li class="page-item {{ 'disabled' if not pagination.has_next }}">
      <a class="page-link" href="{{ url_for(request.endpoint, page=pagination.next_num) if pagination.has_next else '#' }}">Próxima</a>
    </li>
  </ul>
</nav>
{% endif %}
