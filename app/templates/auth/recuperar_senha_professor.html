{% extends 'base.html' %}
{% block title %}Recuperar senha de professor | Helpdesk Manager{% endblock %}
{% block content %}
<div class="login-screen justify-content-center"><div class="login-card"><div class="login-card-top"><div class="login-role-icon mb-3">▦</div><h1 class="h3 mb-0">Recuperar senha de professor</h1><p>Confirme seus dados cadastrais para definir uma nova senha.</p></div><div class="login-card-body"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label" for="nome">Nome completo</label><input id="nome" name="nome" class="form-control mb-3" maxlength="120" autocomplete="name" required><label class="form-label" for="email">E-mail cadastrado</label><input id="email" name="email" type="email" class="form-control mb-3" maxlength="120" autocomplete="email" required><label class="form-label" for="matricula">Matrícula</label><input id="matricula" name="matricula" class="form-control mb-3" pattern="\d-\d{6}" placeholder="0-000000" required><label class="form-label" for="senha">Nova senha</label><input id="senha" name="senha" type="password" class="form-control mb-1" minlength="6" autocomplete="new-password" required><div class="form-text mb-4">Mínimo de 6 caracteres.</div><button class="btn btn-primary w-100" type="submit">Atualizar minha senha</button></form><p class="text-center mt-3 mb-0"><a href="{{ url_for('auth.login_professor') }}">Voltar para o acesso do professor</a></p></div></div></div>
{% endblock %}
