{% extends 'base.html' %}
{% block content %}
<h2>Novo usuário</h2>
<div class="form-card">
<form method="post" class="row g-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="col-md-6"><label class="form-label" for="nome">Nome</label><input id="nome" name="nome" class="form-control" value="{{ request.form.get('nome', '') }}" maxlength="120" required></div>
  <div class="col-md-6"><label class="form-label" for="email">E-mail</label><input id="email" name="email" type="email" class="form-control" value="{{ request.form.get('email', '') }}" maxlength="120" required></div>
  <div class="col-md-4"><label class="form-label" for="perfil">Perfil</label><select id="perfil" name="perfil" class="form-select"><option value="admin">Administrador</option><option value="tecnico">Técnico</option><option value="usuario">Usuário</option><option value="almoxarife">Almoxarife</option></select></div>
  <div class="col-md-4"><label class="form-label" for="setor">Setor</label><input id="setor" name="setor" class="form-control" value="{{ request.form.get('setor', '') }}" maxlength="100"></div>
  <div class="col-md-4"><label class="form-label" for="telefone">Telefone</label><input id="telefone" name="telefone" class="form-control" value="{{ request.form.get('telefone', '') }}" maxlength="30"></div>
  <div class="col-md-6"><label class="form-label" for="nova-senha">Senha</label><input id="nova-senha" name="senha" type="password" class="form-control" minlength="10" autocomplete="new-password" required><div class="form-text">Mínimo de 10 caracteres.</div></div>
  <div class="col-12"><button class="btn btn-primary" type="submit">Salvar</button></div>
</form>
</div>
{% endblock %}
