{% extends 'base.html' %}
{% block title %}Entrar · Helpdesk Manager{% endblock %}
{% block content %}
<div class="login-screen justify-content-center">
  <div class="login-card">
    <div class="login-card-top">
      <div class="brand-mark mb-3">HD</div>
      <h1 class="h3 mb-0">Bem-vindo de volta</h1>
      <p>Acesse o centro de operações do Helpdesk Manager.</p>
    </div>
    <div class="login-card-body">
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="form-label" for="email">E-mail</label>
        <input class="form-control mb-3" id="email" type="email" name="email" autocomplete="username" required>
        <label class="form-label" for="senha">Senha</label>
        <input class="form-control mb-4" id="senha" type="password" name="senha" autocomplete="current-password" required>
        <button class="btn btn-primary w-100" type="submit">Entrar no sistema</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
