{% extends 'base.html' %}
{% block title %}Entrar · Helpdesk Manager{% endblock %}
{% block content %}
<div class="login-screen justify-content-center">
  <div class="login-card">
    <div class="login-card-top">
      <div class="brand-mark mb-3">HD</div>
      <h1 class="h3 mb-0">Bem-vindo de volta</h1>
      <p>Acesse o centro de operações do Helpdesk Manager.</p>
    </div>
    <div class="login-card-body">
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="form-label" for="identificador">E-mail ou matrícula</label>
        <input class="form-control mb-3" id="identificador" name="identificador" autocomplete="username" placeholder="nome@instituicao.edu ou TEC-000123" required autofocus>
        <label class="form-label" for="senha">Senha</label>
        <input class="form-control mb-4" id="senha" type="password" name="senha" autocomplete="current-password" required>
        <button class="btn btn-primary w-100" type="submit">Entrar no sistema</button>
      </form>
      <p class="text-center mt-3 mb-0"><a href="{{ url_for('auth.recuperar_senha') }}">Esqueci minha senha</a></p>
      <a class="teacher-access-card" href="{{ url_for('auth.login_professor') }}">
        <span class="teacher-access-icon">▦</span>
        <span><strong>Sou professor</strong><small>Entre com matrícula e senha para agendar um laboratório</small></span>
        <b aria-hidden="true">→</b>
      </a>
    </div>
  </div>
</div>
{% endblock %}
