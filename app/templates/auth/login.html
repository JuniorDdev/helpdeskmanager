{% extends 'base.html' %}
{% block title %}Entrar · Helpdesk Manager{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="form-card">
      <h3 class="mb-3">Helpdesk Manager</h3>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label class="form-label" for="email">E-mail</label>
        <input class="form-control mb-3" id="email" type="email" name="email" autocomplete="username" required>
        <label class="form-label" for="senha">Senha</label>
        <input class="form-control mb-3" id="senha" type="password" name="senha" autocomplete="current-password" required>
        <button class="btn btn-primary w-100" type="submit">Entrar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
