{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-7">
    <div class="form-card text-center">
      <div class="display-4 fw-bold text-primary">{{ status }}</div>
      <h2>{{ titulo }}</h2>
      <p class="text-muted">{{ mensagem }}</p>
      <a class="btn btn-primary" href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}">Voltar</a>
    </div>
  </div>
</div>
{% endblock %}
