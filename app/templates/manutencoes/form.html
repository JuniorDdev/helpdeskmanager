{% extends 'base.html' %}
{% block content %}
<h2>Nova Manutenção</h2>
<div class="form-card"><form method="post" class="row g-3">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="col-md-6"><label class="form-label">Máquina</label><select name="maquina_id" class="form-select" required>{% for m in maquinas %}<option value="{{ m.id }}">{{ m.patrimonio }} - {{ m.nome_maquina }}</option>{% endfor %}</select></div>
<div class="col-md-6"><label class="form-label">Chamado</label><select name="chamado_id" class="form-select"><option value="">Nenhum</option>{% for c in chamados %}<option value="{{ c.id }}">#{{ c.id }} - {{ c.titulo }}</option>{% endfor %}</select></div>
<div class="col-md-4"><label class="form-label">Técnico</label><select name="tecnico_id" class="form-select" required>{% for t in tecnicos %}<option value="{{ t.id }}">{{ t.nome }}</option>{% endfor %}</select></div>
<div class="col-md-4"><label class="form-label">Tipo</label><select name="tipo" class="form-select"><option value="preventiva">Preventiva</option><option value="corretiva">Corretiva</option></select></div>
<div class="col-md-4"><label class="form-label">Custo</label><input name="custo" type="number" min="0" step="0.01" class="form-control" value="0"></div>
<div class="col-md-6"><label class="form-label">Peça utilizada</label><input name="peca_utilizada" class="form-control"></div>
<div class="col-12"><label class="form-label">Descrição</label><textarea name="descricao" class="form-control" required></textarea></div>
<div class="col-12"><label class="form-label">Observações</label><textarea name="observacoes" class="form-control"></textarea></div>
<div class="col-12"><button class="btn btn-primary">Salvar</button></div>
</form></div>
{% endblock %}
